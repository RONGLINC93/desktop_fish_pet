<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置</title>
<style>
  :root{
    --bg1:#0b2545; --bg2:#13315c; --card:#ffffff; --ink:#13315c;
    --gold:#f2c94c; --gold-ink:#9a6b00; --green:#27ae60; --muted:#8aa0c0;
    --blue:#2f6fed; --red:#e0524d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;}
  body{
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:#eaf2ff;display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
  header h1{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .pool{font-size:13px;color:var(--muted);}
  .body{flex:1;overflow:auto;padding:14px 18px;}
  .box{background:var(--card);color:var(--ink);border-radius:14px;padding:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);margin-bottom:14px;}
  .box h3{margin:0 0 10px;font-size:15px;color:var(--bg2);}
  .item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;
    border-radius:10px;background:#f3f7ff;margin-bottom:8px;}
  .item .name{font-weight:600;flex:1;}
  .item .hint{font-size:12px;color:#5b7099;margin-left:8px;}
  .tg{border:none;border-radius:999px;padding:6px 18px;cursor:pointer;font-weight:700;
    color:#fff;background:#9bb0d0;min-width:56px;transition:filter .15s,background .15s;}
  .tg.on{background:var(--green);}
  .tg:active{transform:translateY(1px);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;
    color:var(--ink);background:#eaf0fb;transition:filter .15s;}
  .chip:hover{filter:brightness(.97);}
  .chip.sel{background:var(--gold);color:var(--gold-ink);}
  .chip.sel-cannon{outline:3px solid var(--gold);}
  .mfhl{border-color:var(--gold)!important;background:#fffbe6;box-shadow:0 0 0 2px rgba(242,201,76,.3);}
  .btn{border:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;
    color:#fff;background:var(--blue);transition:filter .15s;margin-right:8px;}
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:translateY(1px);}
  .btn.wide{width:100%;margin:0 0 8px;}
  .btn.quit{background:var(--red);width:100%;margin-top:4px;}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);
    background:rgba(20,30,50,.85);backdrop-filter:blur(4px);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;
    transition:opacity .2s;pointer-events:none;z-index:9;}
  .toast.show{opacity:1;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:4px;}
</style>
</head>
<body>
  <header>
    <h1>⚙ 设置</h1>
    <div class="pool" id="pool">鱼池 0/0</div>
  </header>
  <div class="body">
    <div class="box"><h3>通用设置</h3><div id="switches"></div></div>
    <div class="box"><h3>屏幕</h3>
      <div class="hint" style="margin-bottom:8px;">选择小鱼游走的屏幕，「全部屏幕」可跨显示器游走；捕鱼炮台与钓鱼钩也会停靠在选定屏幕。</div>
      <div class="chips" id="screens"></div>
    </div>
    <div class="box"><h3>鱼池上限</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input id="mfCustom" type="number" min="1" max="100" placeholder="1~100"
               style="width:88px;padding:6px 8px;border-radius:8px;border:1px solid #cdd8ee;">
        <button class="btn" onclick="doMaxFishCustom()">应用</button>
        <span class="hint" id="mfHint"></span>
      </div>
    </div>
    <div class="box"><h3>鱼池管理</h3>
      <button class="btn" onclick="doAdd()">放一条小鱼</button>
      <button class="btn" onclick="doAddRandom()">随机放几条鱼</button>
    </div>
    <button class="btn quit" onclick="doQuit()">退出程序</button>
  </div>
  <div class="toast" id="toast"></div>

<script>
  let DATA = null;

  const SW = [
    {key:'paused',         label:'暂停游动', api:'toggle_pause'},
    {key:'show_fish',      label:'显示小鱼', api:'toggle_hide'},
    {key:'fishing',        label:'捕鱼模式', api:'toggle_fishing'},
    {key:'goldminer',      label:'钓鱼模式', api:'toggle_goldminer'},
    {key:'sound_enabled',  label:'音效',     api:'toggle_sound'},
    {key:'autostart',      label:'开机自启', api:'toggle_autostart'},
    {key:'mouse_penetration', label:'鼠标穿透', api:'toggle_mouse_penetration'},
    {key:'berserk_enabled',label:'狂暴模式', api:'toggle_berserk'},
  ];

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1500);
  }

  async function refreshSettings(silent){
    try{
      DATA = await window.pywebview.api.get_settings();
      document.getElementById('pool').textContent =
        '鱼池 ' + DATA.fish_count + '/' + DATA.max_fish;
      render();
      if (!silent) toast('已刷新');
    }catch(e){ toast('加载失败：' + e); }
  }

  // 捕鱼模式二级设置行：炮台皮肤，缩进挂在「捕鱼模式」开关下
  function buildCannonSkinRow(){
    const box = document.createElement('div');
    box.style.cssText = 'margin:0 10px 8px;padding:8px 10px;background:#f8fbff;' +
      'border-left:3px solid #e3ebf9;border-radius:0 10px 10px 0;';
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px;';
    const t = document.createElement('span');
    t.style.cssText = 'font-weight:600;font-size:13px;';
    t.textContent = '└ 炮台皮肤';
    const h = document.createElement('span');
    h.style.cssText = 'font-size:12px;color:#5b7099;';
    h.textContent = DATA.fishing
      ? '捕鱼模式下右键炮台也可随时更换'
      : '捕鱼模式开启时生效；开启后右键炮台也可更换';
    head.appendChild(t); head.appendChild(h);
    box.appendChild(head);
    if (DATA.cannon_count === 0){
      const none = document.createElement('span');
      none.style.cssText = 'font-size:12px;color:#5b7099;';
      none.textContent = '未找到炮台素材';
      box.appendChild(none);
      return box;
    }
    const chips = document.createElement('div');
    chips.className = 'chips';
    for (let i = 0; i < DATA.cannon_count; i++){
      const b = document.createElement('button');
      b.className = 'chip' + (i === DATA.cannon_index ? ' sel-cannon' : '');
      b.textContent = '炮台 ' + (i + 1);
      b.onclick = () => callApi('set_cannon', i);
      chips.appendChild(b);
    }
    box.appendChild(chips);
    return box;
  }

  // 钓鱼模式二级设置行：允许挣脱总开关 + 最低挣脱概率（每秒），缩进挂在「钓鱼模式」开关下
  function buildEscapeMinRow(){
    const box = document.createElement('div');
    box.style.cssText = 'margin:0 10px 8px;padding:8px 10px;background:#f8fbff;' +
      'border-left:3px solid #e3ebf9;border-radius:0 10px 10px 0;';
    // └ 允许挣脱：总开关，关闭后收线必中、鱼绝不逃走
    const tgRow = document.createElement('div');
    tgRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;';
    const tgName = document.createElement('span');
    tgName.style.cssText = 'font-weight:600;font-size:13px;';
    tgName.textContent = '└ 允许挣脱';
    const tgBtn = document.createElement('button');
    tgBtn.className = 'tg ' + (DATA.escape_enabled ? 'on' : '');
    tgBtn.textContent = DATA.escape_enabled ? '开' : '关';
    tgBtn.onclick = () => callApi('toggle_escape');
    tgRow.appendChild(tgName); tgRow.appendChild(tgBtn);
    box.appendChild(tgRow);
    if (!DATA.escape_enabled){
      const off = document.createElement('div');
      off.className = 'hint';
      off.style.cssText = 'margin-top:4px;';
      off.textContent = '已关闭：收线时鱼稳稳上钩，不会逃走';
      box.appendChild(off);
      return box;
    }
    const head = document.createElement('div');
    head.style.cssText = 'display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0;';
    const t = document.createElement('span');
    t.style.cssText = 'font-weight:600;font-size:13px;';
    t.textContent = '└ 最低挣脱概率（每秒）';
    const h = document.createElement('span');
    h.style.cssText = 'font-size:12px;color:#5b7099;';
    h.textContent = DATA.goldminer
      ? '便宜小鱼也至少按此概率挣扎；0 = 完全按鱼价值计算'
      : '钓鱼模式开启时生效；0 = 完全按鱼价值计算';
    head.appendChild(t); head.appendChild(h);
    // 手动输入：以「%/秒」为单位，0~40，回车或点「应用」提交（后端钳制到 [0,40]）
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;align-items:center;';
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.min = '0'; inp.max = '40'; inp.step = '0.5';
    inp.value = (DATA.escape_min * 100).toFixed(1).replace(/\.0$/, '');
    inp.placeholder = '0~40';
    inp.style.cssText = 'width:88px;padding:6px 8px;border-radius:8px;border:1px solid #cdd8ee;';
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '应用';
    btn.onclick = () => {
      let p = parseFloat(inp.value);
      if (isNaN(p)) { toast('请输入 0~40 的数字'); return; }
      p = Math.max(0, Math.min(40, p));
      callApi('set_escape_min', p / 100);
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') btn.onclick(); });
    const hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = '（%/秒，0 = 按价值计算）';
    row.appendChild(inp); row.appendChild(btn); row.appendChild(hint);
    box.appendChild(head); box.appendChild(row);
    return box;
  }

  function render(){
    if (!DATA) return;
    // 开关
    const sw = document.getElementById('switches');
    sw.innerHTML = '';
    SW.forEach(s => {
      const on = !!DATA[s.key];
      const row = document.createElement('div'); row.className = 'item';
      const name = document.createElement('span'); name.className = 'name';
      name.textContent = s.label;
      const b = document.createElement('button');
      b.className = 'tg ' + (on ? 'on' : '');
      b.textContent = on ? '开' : '关';
      b.onclick = () => callApi(s.api);
      row.appendChild(name); row.appendChild(b);
      sw.appendChild(row);
      // 捕鱼模式的二级设置：炮台皮肤，紧跟「捕鱼模式」开关之下
      if (s.key === 'fishing') sw.appendChild(buildCannonSkinRow());
      // 钓鱼模式的二级设置：最低挣脱概率，紧跟「钓鱼模式」开关之下
      if (s.key === 'goldminer') sw.appendChild(buildEscapeMinRow());
    });
    // 屏幕选择
    const sc = document.getElementById('screens');
    sc.innerHTML = '';
    const opts = [{index:-1, label:'全部屏幕', res:''}].concat(DATA.monitors || []);
    opts.forEach(m => {
      const b = document.createElement('button');
      b.className = 'chip' + (m.index === DATA.screen ? ' sel' : '');
      b.textContent = m.res ? (m.label + ' (' + m.res + ')') : m.label;
      b.onclick = () => callApi('set_screen', m.index);
      sc.appendChild(b);
    });
    // 鱼池上限（仅自定义输入，不再提供快速选择）
    const inp = document.getElementById('mfCustom');
    inp.value = DATA.max_fish;
    document.getElementById('mfHint').textContent = '当前上限：' + DATA.max_fish + ' 条';
  }

  async function callApi(method, arg){
    try{
      const api = window.pywebview.api;
      const r = arg === undefined
        ? await api[method]()
        : await api[method](arg);
      if (r && r.msg) toast(r.msg);
      if (!r || r.ok !== false) refreshSettings(true);
    }catch(e){ toast('操作失败：' + e); }
  }

  async function doMaxFishCustom(){
    const inp = document.getElementById('mfCustom');
    let v = parseInt(inp.value, 10);
    if (isNaN(v)) { toast('请输入 1~100 的数字'); return; }
    v = Math.max(1, Math.min(100, v));
    inp.value = v;
    await callApi('set_max_fish', v);
  }
  async function doAdd(){ await callApi('add_fish'); }
  async function doAddRandom(){ await callApi('add_fish_random'); }
  async function doQuit(){ await callApi('quit'); }

  window.addEventListener('pywebviewready', () => refreshSettings(true));
</script>
</body>
</html>
