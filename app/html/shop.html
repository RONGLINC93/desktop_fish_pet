<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商城</title>
  <style>
    :root {
      --bg0: #060a14;
      --bg1: #0c1430;
      --bg2: #14204a;
      --panel: #0e1734;
      --cell: #0a1024;
      --gold: #f5c542;
      --gold-2: #c9922b;
      --gold-deep: #8a6414;
      --line: rgba(245, 197, 66, .38);
      --ink: #e9eef8;
      --muted: #8fa0c4;
      --blue: #3d7fd6;
      --blue-2: #2456a8;
      --green: #43c98a;
      --green-2: #1e8a58;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 50% -10%, #1b2c5e 0%, transparent 60%),
        radial-gradient(800px 400px at 90% 110%, #12224e 0%, transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg0));
    }

    /* ---------- 描金外框 + 四角装饰 ---------- */
    .frame {
      position: absolute;
      inset: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(16, 26, 58, .92), rgba(8, 12, 28, .94));
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 24px rgba(0, 0, 0, .55),
        inset 0 0 0 1px rgba(245, 197, 66, .12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(245, 197, 66, .16);
      border-radius: 7px;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid var(--gold);
      filter: drop-shadow(0 0 3px rgba(245, 197, 66, .6));
      pointer-events: none;
    }

    .corner.tl {
      top: 5px;
      left: 5px;
      border-right: none;
      border-bottom: none;
      border-radius: 4px 0 0 0;
    }

    .corner.tr {
      top: 5px;
      right: 5px;
      border-left: none;
      border-bottom: none;
      border-radius: 0 4px 0 0;
    }

    .corner.bl {
      bottom: 5px;
      left: 5px;
      border-right: none;
      border-top: none;
      border-radius: 0 0 0 4px;
    }

    .corner.br {
      bottom: 5px;
      right: 5px;
      border-left: none;
      border-top: none;
      border-radius: 0 0 4px 0;
    }

    /* ---------- 顶部：金币 / 标题 / 鱼池 ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 22px 10px;
      border-bottom: 1px solid rgba(245, 197, 66, .22);
      background: linear-gradient(180deg, rgba(38, 58, 120, .35), transparent);
    }

    .coins {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 0 8px rgba(245, 197, 66, .45);
    }

    .coin {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: radial-gradient(circle at 35% 30%, #fff6c2, var(--gold) 55%, #a97a15);
      box-shadow: 0 0 6px rgba(245, 197, 66, .7), inset 0 -1px 2px rgba(120, 80, 0, .6);
    }

    .title {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 10px;
      text-indent: 10px;
      background: linear-gradient(180deg, #fff3c4, var(--gold) 45%, var(--gold-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .6));
      position: relative;
    }

    .title::before,
    .title::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 46px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }

    .title::before {
      right: calc(100% + 14px);
    }

    .title::after {
      left: calc(100% + 14px);
      transform: scaleX(-1);
    }

    .pool {
      font-size: 13px;
      color: var(--muted);
      border: 1px solid rgba(245, 197, 66, .3);
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(10, 16, 36, .6);
    }

    .pool b {
      color: var(--gold);
      font-weight: 700;
    }

    /* ---------- 主体：左分类 + 右内容 ---------- */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .side {
      width: 132px;
      flex: 0 0 auto;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid rgba(245, 197, 66, .22);
      background: linear-gradient(180deg, rgba(20, 32, 74, .45), rgba(8, 12, 28, .3));
    }

    .cat {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 12px;
      cursor: pointer;
      border: 1px solid rgba(245, 197, 66, .28);
      border-radius: 8px;
      color: var(--muted);
      background: linear-gradient(180deg, #16224a, #0b1230);
      font-size: 14px;
      font-weight: 700;
      transition: all .15s;
      user-select: none;
    }

    .cat .ic {
      font-size: 20px;
      line-height: 1;
      filter: drop-shadow(0 0 4px rgba(245, 197, 66, .4));
    }

    .cat:hover {
      color: var(--ink);
      border-color: rgba(245, 197, 66, .55);
    }

    .cat.active {
      color: #fff;
      border-color: var(--gold);
      background: linear-gradient(180deg, #31468c, #1a2a5e);
      box-shadow: inset 0 0 12px rgba(245, 197, 66, .25), 0 0 8px rgba(245, 197, 66, .2);
    }

    .side .foot {
      margin-top: auto;
      font-size: 11px;
      color: #5d6d92;
      text-align: center;
      line-height: 1.6;
    }

    .content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
    }

    /* 购买 / 出售 子页签 */
    .subtabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .subtab {
      padding: 6px 26px;
      cursor: pointer;
      border: 1px solid rgba(245, 197, 66, .3);
      border-radius: 6px;
      background: rgba(12, 20, 48, .7);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      transition: all .15s;
      user-select: none;
    }

    .subtab:hover {
      color: var(--ink);
    }

    .subtab.active {
      color: #4a3508;
      border-color: var(--gold);
      background: linear-gradient(180deg, #f7d06a, #d9a02c);
      box-shadow: 0 0 10px rgba(245, 197, 66, .35), inset 0 1px 0 rgba(255, 255, 255, .5);
    }

    /* ---------- 物品格子 ---------- */
    .grid {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 2px 6px 2px 2px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      align-content: start;
    }

    .slot {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 9px 8px 8px;
      border: 1px solid rgba(245, 197, 66, .28);
      border-radius: 8px;
      background: linear-gradient(180deg, #101a38, #090f22);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .45);
      transition: all .15s;
    }

    .slot:hover {
      border-color: var(--gold);
      transform: translateY(-1px);
      box-shadow: 0 0 12px rgba(245, 197, 66, .28), inset 0 0 0 1px rgba(0, 0, 0, .45);
    }

    .slot .thumb {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(245, 197, 66, .25);
      border-radius: 8px;
      background: radial-gradient(circle at 50% 42%, rgba(64, 98, 178, .28), rgba(8, 12, 28, .65) 70%);
    }

    .slot .thumb img {
      max-width: 56px;
      max-height: 56px;
      object-fit: contain;
    }

    .slot .thumb .emo {
      font-size: 34px;
      filter: drop-shadow(0 0 6px rgba(245, 197, 66, .5));
    }

    .slot .nm {
      width: 100%;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slot .lv {
      font-size: 11px;
      color: var(--muted);
    }

    .slot .pr {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 800;
      color: var(--gold);
      text-shadow: 0 0 6px rgba(245, 197, 66, .35);
    }

    .slot.sell .pr {
      color: var(--green);
      text-shadow: 0 0 6px rgba(67, 201, 138, .35);
    }

    /* 魔域风金属按钮 */
    .btn {
      width: 100%;
      padding: 5px 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      user-select: none;
      text-align: center;
      border: 1px solid rgba(245, 197, 66, .55);
      background: linear-gradient(180deg, #4a8de8, #2456a8);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -2px 0 rgba(0, 0, 0, .25),
        0 2px 4px rgba(0, 0, 0, .4);
      text-shadow: 0 1px 1px rgba(0, 0, 0, .45);
      transition: filter .12s, transform .05s;
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.gold {
      color: #4a3508;
      text-shadow: 0 1px 0 rgba(255, 255, 255, .4);
      background: linear-gradient(180deg, #f7d06a, #d9a02c);
    }

    .btn.green {
      background: linear-gradient(180deg, #43c98a, #1e8a58);
    }

    .btn.disabled {
      filter: grayscale(.8) brightness(.7);
      cursor: not-allowed;
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      color: #5d6d92;
      padding: 40px 0;
      font-size: 13px;
    }

    /* ---------- 炮台面板 ---------- */
    .cannon {
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 6px;
    }

    .cannon-card {
      width: 380px;
      max-width: 100%;
      text-align: center;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, #13204a, #0a1024);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .5), 0 0 18px rgba(0, 0, 0, .4);
    }

    .cannon-preview {
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      border: 1px solid rgba(245, 197, 66, .22);
      border-radius: 8px;
      background: radial-gradient(circle at 50% 60%, rgba(64, 98, 178, .28), rgba(8, 12, 28, .65) 70%);
    }

    .cannon-preview img {
      max-width: 130px;
      max-height: 140px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .6));
    }

    .cannon-card .big {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(180deg, #fff3c4, var(--gold) 50%, var(--gold-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5));
    }

    .cannon-card .sub {
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0 14px;
    }

    .cannon-card .refund {
      color: var(--green);
      font-size: 13px;
      margin: 12px 0 6px;
    }

    .cannon-card .btn {
      width: 100%;
      padding: 8px 0;
      font-size: 14px;
    }

    .cannon-models {
      width: 380px;
      max-width: 100%;
    }

    .cannon-models .cap {
      font-size: 13px;
      color: var(--muted);
      margin: 4px 0 8px;
      text-align: center;
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .model.sel {
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(245, 197, 66, .35), inset 0 0 0 1px rgba(0, 0, 0, .45);
    }

    /* 提示浮层 */
    .toast {
      position: fixed;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
      background: rgba(12, 20, 48, .92);
      border: 1px solid var(--line);
      color: var(--gold);
      padding: 9px 22px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .5), 0 0 10px rgba(245, 197, 66, .2);
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
      z-index: 9;
    }

    .toast.show {
      opacity: 1;
    }

    /* 深色界面：浅色半透明滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, .05);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(245, 197, 66, .35);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(245, 197, 66, .55);
    }

    .qbtn {
      border: none; cursor: pointer; color: #1a2238; font-weight: 700;
      background: linear-gradient(180deg, #ffd76a, #f0a92e);
      border-radius: 8px; transition: transform .06s;
    }
    .qbtn { width: 30px; height: 30px; font-size: 18px; line-height: 1; }
    .qbtn:active { transform: scale(.92); }
    .qty-in {
      width: 56px; height: 30px; text-align: center; font-size: 15px; font-weight: 700;
      color: #fff; background: rgba(0, 0, 0, .25);
      border: 1px solid rgba(255, 255, 255, .18); border-radius: 8px; outline: none;
    }

    /* 购买数量弹窗 */
    .modal-mask {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(8, 12, 24, .55); z-index: 50;
    }
    .modal {
      width: 300px; padding: 18px 20px 20px; border-radius: 16px;
      background: linear-gradient(180deg, #20283f, #161c2c);
      border: 1px solid rgba(245, 197, 66, .35);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .5);
    }
    .modal-tit { font-size: 16px; font-weight: 700; color: #ffd76a; text-align: center; margin-bottom: 12px; }
    .modal-fish { text-align: center; font-size: 15px; color: #eaf2ff; margin-bottom: 10px; }
    .modal-row { display: flex; align-items: center; justify-content: space-between;
      margin: 8px 2px; color: #cfe6ff; font-size: 14px; }
    .modal-row.total { border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 10px;
      margin-top: 10px; font-weight: 700; }
    .modal-val { display: inline-flex; align-items: center; gap: 4px; color: #fff; }
    .modal-stepper { display: flex; align-items: center; gap: 8px; justify-content: center;
      margin: 6px 0 4px; flex-wrap: wrap; }
    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
    .mbtn { flex: 1; height: 38px; border: none; border-radius: 10px; cursor: pointer;
      font-weight: 700; font-size: 14px; transition: transform .06s; }
    .mbtn:active { transform: scale(.96); }
    .mbtn.cancel { background: rgba(255, 255, 255, .12); color: #dfe7f5; }
    .mbtn.ok { background: linear-gradient(180deg, #ffd76a, #f0a92e); color: #1a2238; }
    .mbtn.ok:disabled { filter: grayscale(.6) brightness(.8); cursor: not-allowed; }

    /* ---------- 出售页：批量选择 ---------- */
    .slot.sell { cursor: pointer; }
    .slot .pick {
      position: absolute; top: 6px; left: 6px; width: 18px; height: 18px;
      border-radius: 50%; border: 1px solid rgba(245, 197, 66, .5);
      background: rgba(0, 0, 0, .35); display: flex; align-items: center;
      justify-content: center; font-size: 12px; font-weight: 900; line-height: 1;
      color: transparent;
    }
    .slot.sel { border-color: var(--gold);
      box-shadow: 0 0 12px rgba(245, 197, 66, .35), inset 0 0 0 1px rgba(0, 0, 0, .45); }
    .slot.sel .pick { background: linear-gradient(180deg, #f7d06a, #d9a02c);
      color: #4a3508; border-color: var(--gold); }
    .slot.sel .pick::before { content: "✓"; }

    /* 批量出售操作条 */
    .sellbar { display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-bottom: 10px; padding: 8px 12px;
      border: 1px solid rgba(67, 201, 138, .35); border-radius: 8px;
      background: linear-gradient(180deg, rgba(20, 48, 40, .35), rgba(8, 16, 12, .3)); }
    .sellbar .sb-info { font-size: 13px; color: var(--ink); }
    .sellbar .sb-info b { color: var(--gold); font-weight: 800; }
    .sellbar .sb-btns { display: flex; gap: 8px; flex: 0 0 auto; }
    .sbtn { padding: 5px 14px; border-radius: 6px; font-size: 13px; font-weight: 700;
      cursor: pointer; user-select: none; color: var(--ink);
      border: 1px solid rgba(245, 197, 66, .4); background: rgba(12, 20, 48, .7); }
    .sbtn:hover { border-color: var(--gold); }
    .sbtn.go { color: #fff; border-color: rgba(67, 201, 138, .6);
      background: linear-gradient(180deg, #43c98a, #1e8a58); }
    .sbtn.go.disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
  </style>
</head>

<body>
  <div class="frame">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <header>
      <div class="coins"><span class="coin"></span><span id="coins">金币：0</span></div>
      <div class="title">商 城</div>
      <div class="pool">鱼池 <b id="pool">0/0</b></div>
    </header>

    <div class="main">
      <nav class="side">
        <div class="cat active" data-cat="fish" onclick="switchCat('fish')">
          <span class="ic">🐟</span>鱼类
        </div>
        <div class="cat" data-cat="cannon" onclick="switchCat('cannon')">
          <span class="ic">💥</span>炮台
        </div>

      </nav>

      <div class="content">
        <!-- 鱼类：购买 / 出售 -->
        <div id="cat-fish" style="display:flex;flex-direction:column;flex:1;min-height:0;">
          <div class="subtabs">
            <div class="subtab active" data-mode="buy" onclick="switchFishMode('buy')">购 买</div>
            <div class="subtab" data-mode="sell" onclick="switchFishMode('sell')">出 售</div>
          </div>
          <div class="sellbar" id="sellBar" style="display:none;">
            <span class="sb-info">已选 <b id="selCount">0</b> 条 · 预计获得 <b id="selGold">0</b> 金币</span>
            <span class="sb-btns">
              <span class="sbtn" onclick="selectAllFish()">全选</span>
              <span class="sbtn" onclick="clearPick()">清空</span>
              <span class="sbtn go" id="sellSelBtn" onclick="doSellMany()">出售选中</span>
            </span>
          </div>
          <div class="grid" id="fishGrid"></div>
        </div>

        <!-- 炮台 -->
        <div id="cat-cannon" class="cannon" style="display:none;">
          <div class="cannon-card" id="cannonCard"></div>
          <div class="cannon-models" id="cannonModels"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- 购买数量弹窗 -->
  <div class="modal-mask" id="buyModal" style="display:none;"
       onclick="if(event.target===this)closeBuyModal()">
    <div class="modal">
      <div class="modal-tit">购买数量</div>
      <div class="modal-fish" id="bmFish"></div>
      <div class="modal-row">
        <span class="modal-lab">单价</span>
        <span class="modal-val"><span class="coin"></span><span id="bmPrice"></span></span>
      </div>
      <div class="modal-stepper">
        <button class="qbtn" type="button" onclick="modalChgQty(-1)">−</button>
        <input class="qty-in" id="bmQty" type="number" min="1" max="999" value="1"
               onchange="modalSetQty(this.value)">
        <button class="qbtn" type="button" onclick="modalChgQty(1)">＋</button>
      </div>
      <div class="modal-row total">
        <span class="modal-lab">合计</span>
        <span class="modal-val"><span class="coin"></span><span id="bmTotal"></span></span>
      </div>
      <div class="modal-btns">
        <button class="mbtn cancel" type="button" onclick="closeBuyModal()">取消</button>
        <button class="mbtn ok" type="button" id="bmOk" onclick="confirmBuy()">确认购买</button>
      </div>
    </div>
  </div>

  <script>
    let DATA = null;
    let CUR_CAT = 'fish';      // fish | cannon
    let FISH_MODE = 'buy';     // buy  | sell
    let PICKED = new Set();    // 出售页已选中的鱼 id（批量出售用）
    let FISH_SIG = '';         // 鱼池列表签名（id:等级），仅在变化时才重绘出售页

    /* 鱼池列表签名：用于判断轮询回来的列表是否真的变了 */
    function fishSig(list) {
      return (list || []).map(f => f.id + ':' + f.level).join(',');
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1500);
    }

    function esc(s) {
      return String(s).replace(/[&<>"]/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    /* 把字符串安全地嵌进单引号包裹的 JS 字面量（Windows 路径含 \ 与可能的 '） */
    function jsStr(s) {
      return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function switchCat(cat) {
      CUR_CAT = cat;
      document.querySelectorAll('.cat').forEach(b =>
        b.classList.toggle('active', b.dataset.cat === cat));
      document.getElementById('cat-fish').style.display = cat === 'fish' ? 'flex' : 'none';
      document.getElementById('cat-cannon').style.display = cat === 'cannon' ? 'flex' : 'none';
      if (DATA) render();
    }

    function switchFishMode(mode) {
      FISH_MODE = mode;
      PICKED.clear();
      document.querySelectorAll('.subtab').forEach(b =>
        b.classList.toggle('active', b.dataset.mode === mode));
      document.getElementById('sellBar').style.display =
        mode === 'sell' ? 'flex' : 'none';
      if (DATA) renderFish();
    }

    /* 购买数量弹窗 */
    let modalKey = null;        // 当前要购买的鱼种序号（与后端 species_list 同序）
    let MODAL_PRICE = 0;       // 单价
    let MODAL_QTY = 1;         // 选择的数量

    function openBuyModal(key, label, price) {
      modalKey = key;
      MODAL_PRICE = Number(price) || 0;
      MODAL_QTY = 1;
      document.getElementById('bmFish').textContent = label;
      document.getElementById('bmPrice').textContent = MODAL_PRICE;
      document.getElementById('bmQty').value = 1;
      updateBuyModal();
      document.getElementById('buyModal').style.display = 'flex';
    }
    function modalChgQty(d) { modalSetQty(MODAL_QTY + d); }
    function modalSetQty(v) {
      v = parseInt(v, 10);
      if (isNaN(v) || v < 1) v = 1;
      if (v > 999) v = 999;
      MODAL_QTY = v;
      document.getElementById('bmQty').value = v;
      updateBuyModal();
    }
    function updateBuyModal() {
      const total = MODAL_PRICE * MODAL_QTY;
      document.getElementById('bmTotal').textContent = total;
      const ok = document.getElementById('bmOk');
      // 金币不足或鱼池放不下时禁用确认
      ok.disabled = (DATA.coins < total) || (DATA.fish_count + MODAL_QTY > DATA.max_fish);
    }
    function closeBuyModal() {
      document.getElementById('buyModal').style.display = 'none';
      modalKey = null;
    }
    function confirmBuy() {
      if (modalKey === null || modalKey === undefined) return;
      const k = modalKey;
      const q = MODAL_QTY;
      closeBuyModal();
      doBuy(k, q);
    }

    /* ---------- 批量出售 ---------- */
    function togglePick(id) {
      if (PICKED.has(id)) PICKED.delete(id); else PICKED.add(id);
      updatePickUI();
    }
    function selectAllFish() {
      PICKED = new Set((DATA.fishes || []).map(f => f.id));
      updatePickUI();
    }
    function clearPick() { PICKED.clear(); updatePickUI(); }
    function updatePickUI() {
      document.querySelectorAll('#fishGrid .slot[data-fid]').forEach(el =>
        el.classList.toggle('sel', PICKED.has(Number(el.dataset.fid))));
      let n = 0, gold = 0;
      (DATA.fishes || []).forEach(f => {
        if (PICKED.has(f.id)) { n++; gold += f.price; }
      });
      document.getElementById('selCount').textContent = n;
      document.getElementById('selGold').textContent = gold;
      document.getElementById('sellSelBtn').classList.toggle('disabled', n === 0);
    }
    async function doSellMany() {
      if (!PICKED.size) return;
      const ids = Array.from(PICKED);
      const r = await window.pywebview.api.sell_many(ids);
      toast(r.msg);
      PICKED.clear();
      if (r.ok) refreshShop(true); else updatePickUI();
    }

    async function refreshShop(silent) {
      try {
        DATA = await window.pywebview.api.get_data();
        FISH_SIG = fishSig(DATA.fishes);
        document.getElementById('coins').textContent = '金币：' + DATA.coins;
        document.getElementById('pool').textContent =
          DATA.fish_count + '/' + DATA.max_fish;
        render();
        if (!silent) toast('已刷新');
      } catch (e) { toast('加载失败：' + e); }
    }

    function render() {
      if (!DATA) return;
      if (CUR_CAT === 'fish') renderFish(); else renderCannon();
    }

    /* 物品格子：缩略图 + 名称 + 金币价 + 按钮 */
    function slot(thumbHtml, name, sub, priceHtml, btnHtml, isSell) {
      return '<div class="slot' + (isSell ? ' sell' : '') + '">' +
        '<div class="thumb">' + thumbHtml + '</div>' +
        '<div class="nm" title="' + esc(name) + '">' + esc(name) + '</div>' +
        (sub ? '<div class="lv">' + esc(sub) + '</div>' : '') +
        '<div class="pr"><span class="coin"></span>' + priceHtml + '</div>' +
        btnHtml + '</div>';
    }

    function renderFish() {
      const grid = document.getElementById('fishGrid');
      const full = DATA.fish_count >= DATA.max_fish;
      let html = '';

      if (FISH_MODE === 'buy') {
        if (!DATA.species.length) {
          grid.innerHTML = '<div class="empty">暂无可购买鱼类</div>'; return;
        }
        DATA.species.forEach((s, i) => {
          const thumb = s.gif
            ? '<img src="' + s.gif + '" alt="' + esc(s.label) + '">'
            : '<span class="emo">🐟</span>';
          const btn = full
            ? '<div class="btn gold disabled">鱼池已满</div>'
            : '<div class="btn gold" onclick="openBuyModal(' + i +
              ', \'' + jsStr(s.label) + '\', ' + s.price + ')">购 买</div>';
          html += slot(thumb, s.label, '', s.price, btn, false);
        });
        grid.innerHTML = html;
      } else {
        if (!DATA.fishes.length) {
          grid.innerHTML = '<div class="empty">鱼池里还没有鱼</div>'; return;
        }
        DATA.fishes.forEach(f => {
          // GIF 不随每条鱼传输，按品种序号复用 species 数组里同一张
          const gif = (f.sp >= 0 && DATA.species[f.sp]) ? DATA.species[f.sp].gif : '';
          const thumb = gif
            ? '<img src="' + gif + '" alt="' + esc(f.label) + '">'
            : '<span class="emo">🐟</span>';
          const sel = PICKED.has(f.id) ? ' sel' : '';
          html += '<div class="slot sell' + sel + '" data-fid="' + f.id +
            '" onclick="togglePick(' + f.id + ')"' +
            ' title="点击选中，可多选后批量出售">' +
            '<span class="pick"></span>' +
            '<div class="thumb">' + thumb + '</div>' +
            '<div class="nm">' + esc(f.label) + '</div>' +
            '<div class="lv">Lv' + f.level + '</div>' +
            '<div class="pr"><span class="coin"></span>+' + f.price + '</div>' +
            '<div class="btn green" onclick="event.stopPropagation();doSell(' + f.id + ')">出 售</div>' +
            '</div>';
        });
        grid.innerHTML = html;
        updatePickUI();
      }
    }

    function renderCannon() {
      const c = document.getElementById('cannonCard');
      let html = (DATA.cannon_img
        ? '<div class="cannon-preview"><img src="' + DATA.cannon_img + '" alt="炮台"></div>'
        : '');
      html += '<div class="big">炮台 Lv' + DATA.cannon_level + ' / ' + DATA.cannon_max + '</div>';
      if (DATA.cannon_level < DATA.cannon_max) {
        html += '<div class="sub">升级到 Lv' + (DATA.cannon_level + 1) +
          ' 需要 ' + DATA.upgrade_cost + ' 金币</div>' +
          '<div class="btn gold" onclick="doUpgrade()">升 级 炮 台</div>';
      } else {
        html += '<div class="sub">炮台已满级</div>';
      }
      if (DATA.cannon_level > 1) {
        html += '<div class="refund">出售炮台（降到 Lv' + (DATA.cannon_level - 1) +
          '）返还 ' + DATA.sell_cannon_refund + ' 金币</div>' +
          '<div class="btn" style="background:linear-gradient(180deg,#e08a4a,#b35a1e)" onclick="doSellCannon()">出 售 炮 台</div>';
      } else {
        html += '<div class="refund">炮台已是最低等级，无法出售</div>';
      }
      c.innerHTML = html;

      const m = document.getElementById('cannonModels');
      if (DATA.cannon_count > 0) {
        let mh = '<div class="cap">切换炮台型号（免费）</div><div class="models-grid">';
        (DATA.cannons || []).forEach((cn, i) => {
          const sel = i === DATA.cannon_index ? ' sel' : '';
          const thumb = cn.img
            ? '<img src="' + cn.img + '" alt="' + esc(cn.label) + '">'
            : '<span class="emo">💥</span>';
          mh += '<div class="slot model' + sel + '" onclick="doSetCannon(' + i + ')"' +
            ' title="' + esc(cn.label) + '">' +
            '<div class="thumb">' + thumb + '</div>' +
            '<div class="nm">' + esc(cn.label) + '</div></div>';
        });
        mh += '</div>';
        m.innerHTML = mh;
      } else {
        m.innerHTML = '';
      }
    }

    async function doBuy(key, qty) {
      const r = await window.pywebview.api.buy(key, qty || 1);
      toast(r.msg); if (r.ok) refreshShop(true);
    }
    async function doSell(id) {
      const r = await window.pywebview.api.sell(id);
      toast(r.msg); if (r.ok) refreshShop(true);
    }
    async function doUpgrade() {
      const r = await window.pywebview.api.upgrade();
      toast(r.msg); if (r.ok) refreshShop(true);
    }
    async function doSellCannon() {
      const r = await window.pywebview.api.sell_cannon();
      toast(r.msg); if (r.ok) refreshShop(true);
    }
    async function doSetCannon(idx) {
      const r = await window.pywebview.api.set_cannon(idx);
      toast(r.msg); if (r.ok) refreshShop(true);
    }

    window.addEventListener('pywebviewready', () => refreshShop(true));

    /* 轻量定时同步：游戏内金币/鱼池数量变化时，顶栏数字每秒实时跟随；
       鱼池列表也每秒轻量同步（无 GIF），繁殖/捕获/出售后出售页即时跟上，
       仅在列表真变化时才重绘，避免打断浏览、跳动滚动条。 */
    setInterval(async () => {
      try {
        const s = await window.pywebview.api.get_status();
        if (s) {
          document.getElementById('coins').textContent = '金币：' + s.coins;
          document.getElementById('pool').textContent =
            s.fish_count + '/' + s.max_fish;
        }
        const fs = await window.pywebview.api.get_fishes();
        if (fs && DATA && fishSig(fs) !== FISH_SIG) {
          FISH_SIG = fishSig(fs);
          DATA.fishes = fs;
          if (FISH_MODE === 'sell') {
            const g = document.getElementById('fishGrid');
            const st = g.scrollTop;   // 保持滚动位置
            renderFish();
            g.scrollTop = st;
          }
        }
      } catch (e) { /* api 未就绪时静默跳过 */ }
    }, 1000);
  </script>
</body>

</html>
